<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Void Dungeon — Co-op Dungeon Crawler</title>
  <link rel="stylesheet" href="./src/style.css" />
</head>
<body>
  <a href="../../index.html" class="gm-hub-btn"><span>🏠</span> Hub</a>
  
  <div id="game-container">
    <canvas id="gameCanvas"></canvas>

    <!-- Controls Overlay / Guide -->
    <div id="hud-controls" class="hud-card">
      <div class="hud-title">🗡️ VOID DUNGEON</div>
      <div class="hud-row"><span class="badge p1">P1</span> WASD: Move | Space: Interact</div>
      <div class="hud-row"><span class="badge p2">P2</span> Arrows: Aim | Enter: Sonar Pulse</div>
      <div class="hud-row mode-hint"><span class="badge mode">MODES</span> Alt+1: Fog | Alt+2: Reveal All | Alt+3: Grid | Alt+4: ESP</div>
    </div>

    <!-- HUD Info (Bottom Left) -->
    <div id="hud-info" class="hud-card bottom-left">
      <div class="hud-row">
        <span>🔑 Keys:</span>
        <span id="hud-keys">0 / 3</span>
      </div>
      <div class="hud-row">
        <span>🌱 Seed:</span>
        <span id="hud-seed">void-1</span>
      </div>
      <div id="hud-mode" class="mode-status">Mode 1: Normal Gameplay (Fog Active)</div>
    </div>
  </div>

  <script type="module" src="./src/main.ts"></script>
</body>
</html>
