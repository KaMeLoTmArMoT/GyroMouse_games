<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Void Dungeon — Co-op Dungeon Crawler</title>
  <link rel="stylesheet" href="./src/style.css" />
</head>
<body>
  <a href="../../index.html" class="gm-hub-btn"><span>🏠</span> Hub</a>
  
  <div id="game-container">
    <canvas id="gameCanvas"></canvas>

    <!-- Controls Overlay / Guide -->
    <div id="hud-controls" class="hud-card">
      <div class="hud-title">🎮 CONTROLS</div>
      <div class="hud-row"><span class="badge p1">P1</span> WASD: Move | Space: Interact</div>
      <div class="hud-row"><span class="badge p2">P2</span> Arrows: Aim | Enter: Action</div>
    </div>

    <!-- HUD Info (Bottom Left) -->
    <div id="hud-info" class="hud-card bottom-left">
      <div class="hud-row">
        <span>🔑 Keys:</span>
        <span id="hud-keys">0 / 3</span>
      </div>
      <div class="hud-row">
        <span>🌱 Seed:</span>
        <span id="hud-seed">void-test</span>
      </div>
    </div>

    <!-- Debug HUD (Top Left below hub button) -->
    <div id="hud-debug" class="hud-card top-left-debug" style="display: none;">
      <div class="hud-title">⚙️ DEBUG MODE</div>
      <div>F1: Toggle Fog</div>
      <div>F3: Toggle Grid</div>
    </div>
  </div>

  <script type="module" src="./src/main.ts"></script>
</body>
</html>
