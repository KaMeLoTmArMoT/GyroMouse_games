<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Wormix - Turn-Based Elemental Artillery 🐛💥</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Outfit', sans-serif;
      background: #0f172a;
      color: #f3f4f6;
    }

    #gameCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      display: block;
    }

    /* Floating Hub Button */
    .back-btn {
      position: fixed;
      top: 16px;
      left: 16px;
      z-index: 100;
      background: rgba(15, 23, 42, 0.7);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #f3f4f6;
      padding: 8px 14px;
      border-radius: 10px;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.85rem;
      transition: all 0.2s ease;
    }
    .back-btn:hover {
      background: rgba(56, 189, 248, 0.2);
      border-color: #38bdf8;
      color: #38bdf8;
    }

    /* AI "Making Decision" Overlay */
    .ai-decision-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 90;
      pointer-events: none;
      background: rgba(15, 23, 42, 0.35);
      backdrop-filter: blur(2px);
    }
    .ai-decision-overlay[hidden] {
      display: none;
    }
    .ai-decision-card {
      display: flex;
      align-items: center;
      gap: 14px;
      background: rgba(30, 41, 59, 0.92);
      border: 1px solid rgba(59, 130, 246, 0.5);
      border-radius: 16px;
      padding: 14px 26px;
      color: #e2e8f0;
      font-weight: 700;
      font-size: 1.05rem;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.45);
    }
    .ai-spinner {
      width: 28px;
      height: 28px;
      flex-shrink: 0;
      border-radius: 50%;
      border: 4px solid rgba(59, 130, 246, 0.25);
      border-top-color: #3b82f6;
      animation: ai-spin 0.8s linear infinite;
    }
    @keyframes ai-spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>
<body>
  <a href="../../index.html" class="back-btn">🏠 Main Hub</a>
  <canvas id="gameCanvas"></canvas>
  <div id="aiDecisionOverlay" class="ai-decision-overlay" hidden>
    <div class="ai-decision-card">
      <div class="ai-spinner"></div>
      <span>🤖 BLUE TEAM is making a decision…</span>
    </div>
  </div>
  <script type="module" src="./src/main.ts"></script>
</body>
</html>
