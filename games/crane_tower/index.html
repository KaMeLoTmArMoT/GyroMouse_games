<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>3D Crane Tower - GyroMouse Games</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&display=swap');
    
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Outfit', sans-serif;
      background: #090d16;
      color: #f3f4f6;
    }

    #game-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    /* Modern Glassmorphism UI Overlay */
    .hud-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-block: space-between;
      padding: 20px;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      width: 100%;
    }

    .card {
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 16px;
      padding: 16px 24px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
      pointer-events: auto;
    }

    .nav-btn {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      padding: 10px 18px;
      border-radius: 12px;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s;
      pointer-events: auto;
    }
    .nav-btn:hover {
      background: rgba(56, 189, 248, 0.2);
      border-color: #38bdf8;
      color: #38bdf8;
    }

    .stats-card {
      display: flex;
      gap: 24px;
      align-items: center;
    }

    .stat-box {
      text-align: center;
    }
    .stat-label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #9ca3af;
      margin-bottom: 4px;
    }
    .stat-value {
      font-size: 1.6rem;
      font-weight: 800;
      color: #38bdf8;
    }

    .controls-hint {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 20px;
      padding: 12px 24px;
      display: flex;
      gap: 20px;
      align-items: center;
      pointer-events: auto;
    }

    .ctrl-pill {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.9rem;
      font-weight: 600;
      color: #e2e8f0;
    }
    .kbd {
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-bottom-width: 3px;
      padding: 4px 10px;
      border-radius: 6px;
      font-family: monospace;
      font-weight: 800;
      color: #fff;
    }

    .btn-drop {
      background: linear-gradient(135deg, #ef4444, #dc2626);
      color: #fff;
      font-weight: 800;
      font-size: 1rem;
      padding: 10px 22px;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(239, 68, 68, 0.4);
      transition: transform 0.1s, box-shadow 0.1s;
    }
    .btn-drop:active {
      transform: scale(0.95);
    }

    /* Settings Checkbox */
    .settings-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.85rem;
      color: #cbd5e1;
      margin-top: 4px;
      cursor: pointer;
    }
    .settings-row input {
      accent-color: #38bdf8;
      cursor: pointer;
    }

    /* Countdown Overlay */
    #countdown-overlay {
      position: fixed;
      top: 30%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 5rem;
      font-weight: 900;
      color: #f59e0b;
      background: rgba(15, 23, 42, 0.9);
      border: 3px solid #f59e0b;
      border-radius: 30px;
      padding: 20px 50px;
      text-shadow: 0 0 30px rgba(245, 158, 11, 0.8);
      box-shadow: 0 0 50px rgba(245, 158, 11, 0.4);
      pointer-events: none;
      z-index: 999;
      display: none;
      text-align: center;
      animation: pulse 0.8s infinite alternate;
    }

    @keyframes pulse {
      from { transform: translate(-50%, -50%) scale(0.95); }
      to { transform: translate(-50%, -50%) scale(1.08); }
    }

    /* Victory / Game Over Overlay Modal */
    .modal-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(9, 13, 22, 0.8);
      backdrop-filter: blur(16px);
      z-index: 100;
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-card {
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 24px;
      padding: 40px;
      width: 90%;
      max-width: 440px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
    }

    .modal-title {
      font-size: 2.2rem;
      font-weight: 900;
      margin-bottom: 12px;
    }

    .modal-desc {
      color: #9ca3af;
      font-size: 1rem;
      margin-bottom: 28px;
    }

    .btn-action {
      background: linear-gradient(135deg, #0284c7, #2563eb);
      color: #fff;
      font-weight: 800;
      font-size: 1.1rem;
      padding: 14px 32px;
      border-radius: 14px;
      border: none;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(2, 132, 199, 0.4);
      width: 100%;
      transition: all 0.2s;
    }
    .btn-action:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(2, 132, 199, 0.6);
    }
  </style>
</head>
<body>
  <canvas id="game-canvas"></canvas>

  <div class="hud-layer">
    <div class="top-bar">
      <a href="../../index.html" class="nav-btn">
        <span>🏠</span> Hub
      </a>

      <div class="card stats-card">
        <div class="stat-box">
          <div class="stat-label">Level</div>
          <div class="stat-value" id="hud-level">1</div>
        </div>
        <div class="stat-box">
          <div class="stat-label">In Zone</div>
          <div class="stat-value" id="hud-cargo">0 / 3</div>
        </div>
        <div style="width: 1px; height: 32px; background: rgba(255,255,255,0.15);"></div>
        <div class="stat-box">
          <div class="stat-label">Aim Goal</div>
          <select id="select-target-goal" class="nav-btn" style="padding: 4px 8px; font-size: 0.85rem; background: rgba(15,23,42,0.9); cursor: pointer;">
            <option value="3" selected>3 Boxes</option>
            <option value="5">5 Boxes</option>
            <option value="7">7 Boxes</option>
            <option value="9">9 Boxes</option>
            <option value="11">11 Boxes</option>
          </select>
        </div>
        <div style="width: 1px; height: 32px; background: rgba(255,255,255,0.15);"></div>
        <div class="stat-box">
          <button id="btn-sound" class="nav-btn" style="padding: 6px 12px; font-size: 0.85rem;">
            🔊 Mute
          </button>
          <label class="settings-row">
            <input type="checkbox" id="chk-show-target" checked />
            Show Zone
          </label>
        </div>
      </div>
    </div>

    <!-- Controls Hint -->
    <div class="controls-hint">
      <div class="ctrl-pill">
        <span style="color: #38bdf8;">P1 (Height):</span>
        <span class="kbd">W</span><span class="kbd">S</span> / <span class="kbd">↑</span><span class="kbd">↓</span>
      </div>
      <div style="width: 1px; height: 20px; background: rgba(255,255,255,0.2);"></div>
      <div class="ctrl-pill">
        <span style="color: #a855f7;">P2 (Position):</span>
        <span class="kbd">A</span><span class="kbd">D</span> / <span class="kbd">←</span><span class="kbd">→</span>
      </div>
      <div style="width: 1px; height: 20px; background: rgba(255,255,255,0.2);"></div>
      <button class="btn-drop" id="btn-drop">DROP (SPACE)</button>
    </div>
  </div>

  <!-- Countdown Overlay -->
  <div id="countdown-overlay">5</div>

  <!-- Victory / Game Over Modal -->
  <div class="modal-overlay" id="game-modal">
    <div class="modal-card">
      <h2 class="modal-title" id="modal-title">Level Cleared! 🎉</h2>
      <p class="modal-desc" id="modal-desc">All crates secured on the train flatbed!</p>
      <div style="display: flex; gap: 12px; flex-direction: column;">
        <button class="btn-action" id="modal-btn">Next Level ▶</button>
        <a href="../../index.html" class="nav-btn" style="justify-content: center; text-decoration: none;">🏠 Hub</a>
      </div>
    </div>
  </div>

  <script type="module" src="./src/main.ts"></script>
</body>
</html>
