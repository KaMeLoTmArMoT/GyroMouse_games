<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>3D Crane Tower - GyroMouse Games</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&display=swap');
    
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Outfit', sans-serif;
      background: #090d16;
      color: #f3f4f6;
    }

    #game-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    /* Modern Glassmorphism UI Overlay */
    .hud-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 20px;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      width: 100%;
    }

    .card {
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 16px;
      padding: 16px 24px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
      pointer-events: auto;
    }

    .nav-btn {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      padding: 10px 18px;
      border-radius: 12px;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s;
      pointer-events: auto;
    }
    .nav-btn:hover {
      background: rgba(56, 189, 248, 0.2);
      border-color: #38bdf8;
      color: #38bdf8;
    }

    .stats-card {
      display: flex;
      gap: 24px;
      align-items: center;
    }

    .stat-box {
      text-align: center;
    }
    .stat-label {
      font-size: 0.75rem;
      color: #9ca3af;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .stat-value {
      font-size: 1.5rem;
      font-weight: 900;
      color: #38bdf8;
    }

    .settings-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.85rem;
      color: #9ca3af;
      margin-top: 4px;
      cursor: pointer;
    }

    /* Controls Hint Bar */
    .controls-hint {
      align-self: center;
      background: rgba(15, 23, 42, 0.8);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 20px;
      padding: 12px 28px;
      display: flex;
      align-items: center;
      gap: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      pointer-events: auto;
    }

    .ctrl-pill {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.9rem;
      font-weight: 700;
    }

    .kbd {
      background: rgba(56, 189, 248, 0.2);
      border: 1px solid rgba(56, 189, 248, 0.4);
      color: #38bdf8;
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 0.8rem;
    }

    .btn-drop {
      background: linear-gradient(135deg, #0284c7, #2563eb);
      color: #fff;
      border: none;
      padding: 10px 20px;
      border-radius: 12px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(2, 132, 199, 0.4);
      transition: all 0.2s;
    }
    .btn-drop:hover {
      transform: scale(1.05);
      box-shadow: 0 6px 20px rgba(2, 132, 199, 0.6);
    }

    /* Countdown Overlay */
    #countdown-overlay {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 6rem;
      font-weight: 900;
      color: #fbbf24;
      text-shadow: 0 0 30px rgba(251, 191, 36, 0.6);
      z-index: 20;
      pointer-events: none;
      display: none;
    }

    /* Modals */
    .modal-overlay {
      position: absolute;
      inset: 0;
      background: rgba(8, 11, 22, 0.8);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }
    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-card {
      background: #0f172a;
      border: 1px solid rgba(56, 189, 248, 0.3);
      border-radius: 24px;
      padding: 36px;
      max-width: 420px;
      width: 90%;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
    }

    .modal-title {
      font-size: 2rem;
      font-weight: 900;
      color: #fff;
      margin-bottom: 12px;
    }
    .modal-desc {
      color: #9ca3af;
      margin-bottom: 24px;
      font-size: 1rem;
    }

    .btn-action {
      background: linear-gradient(135deg, #0284c7, #2563eb);
      color: #fff;
      border: none;
      padding: 14px 28px;
      border-radius: 14px;
      font-weight: 800;
      font-size: 1.1rem;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(2, 132, 199, 0.4);
      width: 100%;
      transition: all 0.2s;
    }
    .btn-action:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(2, 132, 199, 0.6);
    }
  </style>
</head>
<body>
  <a href="../../index.html" class="gm-hub-btn"><span>🏠</span> Hub</a>
  <canvas id="game-canvas"></canvas>

  <div class="hud-layer">
    <div class="top-bar gm-hud-container">
      <div></div>

      <div class="card stats-card">
        <div class="stat-box">
          <div class="stat-label">Level</div>
          <div class="stat-value" id="hud-level">1</div>
        </div>
        <div class="stat-box">
          <div class="stat-label">In Zone</div>
          <div class="stat-value" id="hud-cargo">0 / 3</div>
        </div>
        <div style="width: 1px; height: 32px; background: rgba(255,255,255,0.15);"></div>
        <div class="stat-box">
          <div class="stat-label">Aim Goal</div>
          <select id="select-target-goal" class="nav-btn" style="padding: 4px 8px; font-size: 0.85rem; background: rgba(15,23,42,0.9); cursor: pointer;">
            <option value="3" selected>3 Boxes</option>
            <option value="5">5 Boxes</option>
            <option value="7">7 Boxes</option>
            <option value="9">9 Boxes</option>
            <option value="11">11 Boxes</option>
          </select>
        </div>
        <div style="width: 1px; height: 32px; background: rgba(255,255,255,0.15);"></div>
        <div class="stat-box">
          <button id="btn-sound" class="nav-btn" style="padding: 6px 12px; font-size: 0.85rem;">
            🔊 Mute
          </button>
          <label class="settings-row">
            <input type="checkbox" id="chk-show-target" checked />
            Show Zone
          </label>
        </div>
      </div>
    </div>

    <!-- Controls Hint -->
    <div class="controls-hint">
      <div class="ctrl-pill">
        <span style="color: #38bdf8;">P1 (Height):</span>
        <span class="kbd">W</span><span class="kbd">S</span> / <span class="kbd">↑</span><span class="kbd">↓</span>
      </div>
      <div style="width: 1px; height: 20px; background: rgba(255,255,255,0.2);"></div>
      <div class="ctrl-pill">
        <span style="color: #a855f7;">P2 (Position):</span>
        <span class="kbd">A</span><span class="kbd">D</span> / <span class="kbd">←</span><span class="kbd">→</span>
      </div>
      <div style="width: 1px; height: 20px; background: rgba(255,255,255,0.2);"></div>
      <button class="btn-drop" id="btn-drop">DROP (SPACE)</button>
    </div>
  </div>

  <!-- Countdown Overlay -->
  <div id="countdown-overlay">5</div>

  <!-- Victory / Game Over Modal -->
  <div class="modal-overlay" id="game-modal">
    <div class="modal-card">
      <h2 class="modal-title" id="modal-title">Level Cleared! 🎉</h2>
      <p class="modal-desc" id="modal-desc">All crates secured on the train flatbed!</p>
      <div style="display: flex; gap: 12px; flex-direction: column;">
        <button class="btn-action" id="modal-btn">Next Level ▶</button>
        <a href="../../index.html" class="nav-btn" style="justify-content: center; text-decoration: none;">🏠 Hub</a>
      </div>
    </div>
  </div>

  <script type="module" src="./src/main.ts"></script>
</body>
</html>
