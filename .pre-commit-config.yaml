repos:
  - repo: https://github.com/KaMeLoTmArMoT/stampver
    rev: v0.2.1
    hooks:
      - id: stampver
  - repo: https://github.com/kucherenko/jscpd
    rev: 5.4.2
    hooks:
      - id: jscpd
        args: ['--threshold', '2', '--min-tokens', '50', '--min-lines', '5', '--pattern', '**/*.ts', 'games', 'shared']
